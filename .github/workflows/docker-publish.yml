name: Build SimpleLogin Multi-Arch

on:
  push:
    branches: ["main"]
    paths:
      - 'upstream-version.txt'
      - 'Dockerfile'
      - 'modern-ui.patch'
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      apply_patch:
        description: 'Apply the modern-ui patch'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APPLY_PATCH: false # Set to true to apply the modern-ui patch by default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout your repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read Version
        id: get_version
        run: |
          # Grabs the version, ignoring comments
          VERSION=$(grep -v '^#' upstream-version.txt | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine if patch should be applied
        id: patch_config
        run: |
          # Use input if available (manual trigger), otherwise use environment variable
          APPLY="${{ github.event.inputs.apply_patch }}"
          if [ -z "$APPLY" ]; then
            APPLY="${{ env.APPLY_PATCH }}"
          fi
          echo "apply=$APPLY" >> $GITHUB_OUTPUT

          # Use Node 24 (LTS) when patch is applied, otherwise stick to original 10.17.0
          if [ "$APPLY" = "true" ]; then
            echo "node_version=24" >> $GITHUB_OUTPUT
          else
            echo "node_version=10.17.0" >> $GITHUB_OUTPUT
          fi

      - name: Checkout SimpleLogin upstream
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: simple-login/app
          ref: ${{ steps.get_version.outputs.VERSION }}
          path: upstream

      - name: Apply Modern UI Patch
        if: ${{ steps.patch_config.outputs.apply == 'true' }}
        run: |
          cd upstream
          git apply ../modern-ui.patch

      - name: Generate build info
        run: |
          cd upstream
          SHA=$(git rev-parse HEAD)
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ./scripts/generate-build-info.sh "$SHA" "$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.get_version.outputs.VERSION }}${{ steps.patch_config.outputs.apply == 'true' && '-modern-ui' || '' }}

      - name: Build and Push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./upstream
          file: ./Dockerfile 
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ steps.patch_config.outputs.node_version }}